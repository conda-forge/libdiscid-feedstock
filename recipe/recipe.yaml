schema_version: 1

context:
  name: libdiscid
  version: "0.7.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/metabrainz/libdiscid/archive/v${{ version }}.tar.gz
  sha256: ad261d3df0a2761f060cdcbf20c926857f1d5a1862d8b8679433284dd1f2e1cd

build:
  number: 1

requirements:
  build:
    - cmake
    - ninja
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  run_exports:
    - ${{ pin_subpackage(name, upper_bound='x.x') }}

tests:
  - package_contents:
      lib:
        - discid
      include:
        - discid/discid.h

about:
  license: LGPL-2.1-or-later
  license_file: COPYING
  summary: A Library for creating MusicBrainz DiscIDs
  description: |
    `libdiscid` is a C library for creating MusicBrainz and freedb disc IDs from audio CDs. It reads a CD's table of contents (TOC) and generates an identifier which can be used to look up the CD at MusicBrainz. Additionally, it provides a submission URL for adding the disc ID to the database and gathers ISRCs and the MCN (=UPC/EAN) from disc.

  homepage: https://musicbrainz.org/doc/libdiscid
  repository: https://github.com/metabrainz/libdiscid
  documentation: https://musicbrainz.org/doc/libdiscid

extra:
  recipe-maintainers:
    - HeavyTony2
